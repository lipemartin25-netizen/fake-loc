name: Android checks
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Accept licenses and install platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            # Fallback: find sdkmanager anywhere under ANDROID_HOME
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test Android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fake-loc-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
